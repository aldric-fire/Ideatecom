<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Events</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLMDJ8C+a5+q9gW76j42N71nB4mE/2/j6k9N7r+A2hV9eY8c6F8p6E6aN/F4aA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .progress-bar {
            height: 8px;
            background-color: #e5e7eb; /* gray-200 */
            border-radius: 9999px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            transition: width 0.4s ease-in-out;
        }
    </style>
    <script>
        const VOLUNTEERS_STORAGE_KEY = 'AB_VOLUNTEERS';
        const ACTIVITIES_STORAGE_KEY = 'AB_ACTIVITIES';

        function getVolunteers() {
            try {
                const data = localStorage.getItem(VOLUNTEERS_STORAGE_KEY);
                return data ? JSON.parse(data) : [];
            } catch (e) { return []; }
        }

        function saveVolunteers(volunteers) {
            try {
                localStorage.setItem(VOLUNTEERS_STORAGE_KEY, JSON.stringify(volunteers));
            } catch (e) { console.error("Error saving volunteers to localStorage:", e); }
        }

        function getActivities() {
            try {
                const data = localStorage.getItem(ACTIVITIES_STORAGE_KEY);
                return data ? JSON.parse(data) : [];
            } catch (e) { return []; }
        }
        
        function saveActivities(activities) {
            try {
                localStorage.setItem(ACTIVITIES_STORAGE_KEY, JSON.stringify(activities));
            } catch (e) { console.error("Error saving activities to localStorage:", e); }
        }

        // Helper to format date/time
        function formatDate(isoString) {
            const date = new Date(isoString + 'T00:00:00'); 
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        // Custom Message Box function (replacing alert())
        function showMessageBox(message, isError = false) {
            const messageBox = document.getElementById('message-box');
            const messageText = document.getElementById('message-box-text');
            const messageCard = document.getElementById('message-box-card');
            const messageIcon = document.getElementById('message-box-icon');
            
            messageText.innerHTML = message;
            
            // Set styles based on error status
            if (isError) {
                messageCard.classList.remove('border-sky-500');
                messageCard.classList.add('border-red-500');
                document.getElementById('message-box-button').classList.remove('bg-sky-500');
                document.getElementById('message-box-button').classList.add('bg-red-500');
                messageIcon.className = 'fa-solid fa-triangle-exclamation text-red-500 text-3xl mb-3';
            } else {
                messageCard.classList.remove('border-red-500');
                messageCard.classList.add('border-green-500'); // Changed to green for success
                document.getElementById('message-box-button').classList.remove('bg-red-500');
                document.getElementById('message-box-button').classList.add('bg-green-500');
                messageIcon.className = 'fa-solid fa-circle-check text-green-500 text-3xl mb-3';
            }
            messageBox.classList.remove('hidden');
        }
        
        window.handleRegistration = function(activityId) {
            let volunteers = getVolunteers();
            let activities = getActivities();

            // Find the mock user (first non-planner volunteer, or just the first one)
            const currentUser = volunteers.find(v => v.role !== 'planner') || volunteers[0];

            if (!currentUser) {
                showMessageBox("Error: Volunteer profile not found. Please ensure you are logged in/signed up.", true);
                return;
            }
            
            // 1. Check if user is already assigned
            if (currentUser.assignedActivityId) {
                const currentAssignment = activities.find(a => a.id === currentUser.assignedActivityId);
                const assignedName = currentAssignment ? currentAssignment.name : 'another event';
                showMessageBox(`You are already assigned to: <strong>${assignedName}</strong>. Please complete or unregister from your current mission first.`, true);
                return;
            }

            const activityIndex = activities.findIndex(a => a.id === activityId);
            if (activityIndex === -1) {
                showMessageBox("Error: Activity not found.", true);
                return;
            }
            
            const activity = activities[activityIndex];

            // 2. Check if the activity is full (redundant check, but good for safety)
            if (activity.assignedVolunteerIds.length >= activity.requiredVolunteers) {
                showMessageBox(`The activity "<strong>${activity.name}</strong>" is already full.`, true);
                return;
            }
            
            // 3. Perform registration
            
            // Update Activity
            activity.assignedVolunteerIds.push(currentUser.id);
            
            // Update Volunteer
            const volunteerIndex = volunteers.findIndex(v => v.id === currentUser.id);
            if (volunteerIndex !== -1) {
                volunteers[volunteerIndex].assignedActivityId = activityId;
            }

            saveActivities(activities);
            saveVolunteers(volunteers);

            showMessageBox(`Success! You are now registered for "<strong>${activity.name}</strong>" on ${formatDate(activity.date)}.`);
            renderEvents(); // Refresh UI
        }

        // --- NEW: Sorting Logic ---
        let currentSort = 'date-asc'; // Default sort

        window.updateSort = function(newSort) {
            currentSort = newSort;
            renderEvents();
            
            // Visually update the button
            document.querySelectorAll('#sort-controls button').forEach(btn => {
                btn.classList.remove('bg-sky-500', 'text-white');
                btn.classList.add('bg-gray-200', 'text-gray-700');
            });
            document.getElementById(`sort-${newSort}`).classList.remove('bg-gray-200', 'text-gray-700');
            document.getElementById(`sort-${newSort}`).classList.add('bg-sky-500', 'text-white');
        }

        function getSortedEvents(activities) {
            let sorted = [...activities];

            switch(currentSort) {
                case 'date-asc':
                    sorted.sort((a, b) => new Date(a.date) - new Date(b.date));
                    break;
                case 'date-desc':
                    sorted.sort((a, b) => new Date(b.date) - new Date(a.date));
                    break;
                case 'spots-desc': // Most spots left
                    sorted.sort((a, b) => 
                        (b.requiredVolunteers - b.assignedVolunteerIds.length) - 
                        (a.requiredVolunteers - a.assignedVolunteerIds.length)
                    );
                    break;
                case 'spots-asc': // Fewest spots left
                    sorted.sort((a, b) => 
                        (a.requiredVolunteers - a.assignedVolunteerIds.length) - 
                        (b.requiredVolunteers - b.assignedVolunteerIds.length)
                    );
                    break;
            }
            return sorted;
        }
        // --- END Sorting Logic ---

        function renderEvents() {
            const activities = getActivities();
            const volunteers = getVolunteers();
            const eventsList = document.getElementById('events-list');
            
            const currentUser = volunteers.find(v => v.role !== 'planner') || volunteers[0];

            if (!currentUser) {
                eventsList.innerHTML = '<li class="p-4 text-center text-red-500">No volunteer profile loaded. Please sign up first.</li>';
                return;
            }
            
            // Filter events: only show events that are not full AND are in the future
            const today = new Date().toISOString().split('T')[0];
            const availableEvents = activities
                .filter(a => a.assignedVolunteerIds.length < a.requiredVolunteers)
                .filter(a => a.date >= today); 

            const sortedEvents = getSortedEvents(availableEvents);

            if (sortedEvents.length === 0) {
                eventsList.innerHTML = `
                    <li class="p-8 text-center text-gray-500 bg-white rounded-xl shadow-lg border-l-4 border-red-400">
                        <i class="fa-solid fa-mug-hot text-4xl mb-3 text-red-400"></i>
                        <p class="text-xl font-semibold">Mission Control is quiet!</p>
                        <p class="mt-2">All upcoming activities are either full or none have been scheduled yet. Check back soon!</p>
                    </li>
                `;
                return;
            }

            eventsList.innerHTML = sortedEvents.map(activity => {
                const assigned = activity.assignedVolunteerIds.length;
                const required = activity.requiredVolunteers;
                const remaining = required - assigned;
                const percentFull = (assigned / required) * 100;
                
                const isRegistered = activity.assignedVolunteerIds.includes(currentUser.id);
                const isAssignedToOther = currentUser.assignedActivityId && currentUser.assignedActivityId !== activity.id;
                
                let buttonText = 'Register Now';
                let buttonClass = 'bg-sky-500 hover:bg-sky-700';
                let buttonIcon = '<i class="fa-solid fa-clipboard-check mr-2"></i>';
                let buttonDisabled = false;

                if (isRegistered) {
                    buttonText = 'Registered!';
                    buttonClass = 'bg-green-500 cursor-not-allowed';
                    buttonIcon = '<i class="fa-solid fa-check-double mr-2"></i>';
                    buttonDisabled = true;
                } else if (isAssignedToOther) {
                    buttonText = 'Assigned Elsewhere';
                    buttonClass = 'bg-red-500 cursor-not-allowed';
                    buttonIcon = '<i class="fa-solid fa-ban mr-2"></i>';
                    buttonDisabled = true;
                }

                // Progress bar colors
                let progressClass = 'bg-green-500';
                if (remaining <= 2) {
                    progressClass = 'bg-red-500';
                } else if (remaining <= 4) {
                    progressClass = 'bg-yellow-500';
                }
                
                return `
                    <li class="bg-white p-6 rounded-xl shadow-lg border-t-4 border-sky-400 flex flex-col transition duration-300 hover:shadow-2xl hover:scale-[1.01]">
                        <div class="flex justify-between items-start mb-4">
                            <div class="md:w-2/3">
                                <p class="text-2xl font-bold text-gray-800">${activity.name}</p>
                                <p class="text-md text-sky-600 font-semibold mt-1">
                                    <i class="fa-solid fa-calendar-alt mr-2"></i> ${formatDate(activity.date)}
                                </p>
                            </div>
                            <div class="md:w-1/3 flex flex-col items-end space-y-1">
                                <span class="px-3 py-1 text-sm font-semibold rounded-full ${remaining <= 2 ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800'}">
                                    ${remaining <= 2 ? '<i class="fa-solid fa-fire-extinguisher mr-1"></i> HIGH DEMAND' : '<i class="fa-solid fa-check-circle mr-1"></i> SPOTS OPEN'}
                                </span>
                            </div>
                        </div>

                        <div class="mb-4">
                            <p class="text-sm text-gray-600 mb-2 font-medium">
                                <i class="fa-solid fa-person-biking text-blue-500 mr-1"></i> Role Needed: 
                                <span class="font-bold">${activity.roleNeeded.charAt(0).toUpperCase() + activity.roleNeeded.slice(1).replace('-', ' ')}</span>
                            </p>
                            <div class="text-xs text-gray-500 mb-1 flex justify-between">
                                <span>Spots Left: <span class="font-bold text-base ${remaining <= 2 ? 'text-red-600' : 'text-green-600'}">${remaining}</span>/${required}</span>
                                <span>${Math.round(percentFull)}% Full</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill ${progressClass}" style="width: ${percentFull}%;"></div>
                            </div>
                        </div>

                        <button 
                            onclick="handleRegistration('${activity.id}')"
                            class="${buttonClass} text-white font-bold py-3 px-6 rounded-lg transition duration-200 w-full disabled:opacity-70 disabled:cursor-not-allowed text-lg shadow-md"
                            ${buttonDisabled ? 'disabled' : ''}>
                            ${buttonIcon} ${buttonText}
                        </button>
                    </li>
                `;
            }).join('');

            // Ensure the correct sort button is highlighted on initial load/render
            updateSort(currentSort); 
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            renderEvents();
            
            document.getElementById('close-message-box').addEventListener('click', () => {
                document.getElementById('message-box').classList.add('hidden');
            });
            
            // Initialize the sort button highlight
            updateSort(currentSort);
        });
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <div id="message-box" class="fixed inset-0 bg-gray-600 bg-opacity-75 flex items-center justify-center z-50 hidden">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-80 text-center border-t-4 border-sky-500" id="message-box-card">
            <i id="message-box-icon" class="text-3xl mb-3"></i>
            <p id="message-box-text" class="text-lg font-semibold text-gray-800 mb-4"></p>
            <button id="close-message-box" class="bg-sky-500 hover:bg-sky-600 text-white py-2 px-4 rounded-lg text-sm" id="message-box-button">
                OK
            </button>
        </div>
    </div>
    
    <header class="bg-sky-600 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-extrabold text-white tracking-wide"><i class="fa-solid fa-bicycle mr-2"></i> Ageless Bicyclists</h1>
            <nav class="space-x-4 flex">
                <a href="index.html" class="text-white hover:text-sky-200 px-3 py-2 rounded-md font-medium transition duration-150">Home</a>
                <a href="dashboard.html" class="text-white hover:text-sky-200 px-3 py-2 rounded-md font-medium transition duration-150">Dashboard</a>
                <a href="events.html" class="text-white bg-sky-700 hover:bg-sky-800 px-3 py-2 rounded-lg font-bold transition duration-150 shadow-md">Events</a>
                <a href="admin.html" class="text-white hover:text-sky-200 px-3 py-2 rounded-md font-medium transition duration-150">Admin</a>
            </nav>
        </div>
    </header>

    <div class="max-w-4xl mx-auto p-6 sm:p-8 flex-grow w-full">
        
        <h2 class="text-3xl font-extrabold text-sky-700 mb-2">Find Your Next Mission!</h2>
        <p class="text-gray-600 mb-6">Browse the list of available volunteer activities below. **You can only register for one mission at a time.**</p>
        
        <div class="mb-6 bg-white p-4 rounded-xl shadow-md border-l-4 border-purple-500">
            <p class="text-sm font-semibold text-gray-700 mb-2">Sort By:</p>
            <div id="sort-controls" class="flex flex-wrap gap-2">
                <button id="sort-date-asc" onclick="updateSort('date-asc')" class="px-3 py-1 text-sm rounded-full bg-sky-500 text-white transition duration-150 hover:bg-sky-600">
                    <i class="fa-solid fa-arrow-up mr-1"></i> Soonest Date
                </button>
                <button id="sort-date-desc" onclick="updateSort('date-desc')" class="px-3 py-1 text-sm rounded-full bg-gray-200 text-gray-700 transition duration-150 hover:bg-gray-300">
                    <i class="fa-solid fa-arrow-down mr-1"></i> Latest Date
                </button>
                <button id="sort-spots-desc" onclick="updateSort('spots-desc')" class="px-3 py-1 text-sm rounded-full bg-gray-200 text-gray-700 transition duration-150 hover:bg-gray-300">
                    <i class="fa-solid fa-star mr-1"></i> Most Spots Left
                </button>
                <button id="sort-spots-asc" onclick="updateSort('spots-asc')" class="px-3 py-1 text-sm rounded-full bg-gray-200 text-gray-700 transition duration-150 hover:bg-gray-300">
                    <i class="fa-solid fa-fire mr-1"></i> High Demand
                </button>
            </div>
        </div>
        
        <ul id="events-list" class="space-y-4">
            <li class="p-6 text-center text-gray-400 bg-white rounded-xl shadow-md">Loading activities...</li>
        </ul>
        
    </div>

    <footer class="bg-gray-800 text-white text-center py-4 mt-auto text-sm">
        &copy; 2025 Ageless Bicyclists | Mission Data.
    </footer>
</body>
</html>
