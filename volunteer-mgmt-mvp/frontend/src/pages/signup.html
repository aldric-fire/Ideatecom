<!DOCTYPE html>
<html>
<head>
  <title>Volunteer Sign Up</title>
  <link rel="stylesheet" href="src/style/styles.css">
</head>
<body>
  <!-- Header -->
  <header>
    <h1>🚲 Volunteer Sign Up</h1>
    <nav>
      <a href="index.html">Home</a> |
      <a href="onboarding.html">Onboarding</a> |
      <a href="dashboard.html">Dashboard</a> |
      <a href="events.html">Events</a> |
      <a href="admin.html">Admin</a>
    </nav>
  </header>

  <!-- Main Container -->
  <div class="container">
    <div class="card">
      <h2>Sign Up Form</h2>
      <p>Join our community and contribute your skills to make a difference!</p>

      <form>
        <label>
          Name:
          <input type="text" name="name" placeholder="Your full name">
        </label>

        <label>
          Age:
          <input type="number" name="age" placeholder="Your age">
        </label>

        <label>
          Skills:
          <input type="text" name="skills" placeholder="E.g., mechanics, event planning">
        </label>

        <label>
          Preferred Role:
          <select name="role">
            <option value="cycling-buddy">Cycling Buddy</option>
            <option value="mechanic">Mechanic</option>
            <option value="event-helper">Event Helper</option>
          </select>
        </label>

        <button type="submit">Submit</button>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    &copy; 2025 Ageless Bicyclists
  </footer>
</body>
</html>
